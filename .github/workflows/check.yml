name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  content-and-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-render.txt
            requirements-design.txt
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install local build dependencies
        run: python -m pip install -r requirements-render.txt -r requirements-design.txt
      - name: Check content and diagram pairing
        run: |
          python tools/fieldbook.py check
          python tools/check.py
          python tools/content.py check
      - name: Run offline examples and publication regressions
        run: |
          python -m unittest discover -s tests -v
          node --test examples/health-worker/worker.test.mjs
          python examples/job-state/demo.py
      - name: Build reader site
        run: python tools/build_site.py
