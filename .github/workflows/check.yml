name: Checks and Pages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-and-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-render.txt
            requirements-design.txt
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install local build dependencies
        run: python -m pip install -r requirements-render.txt -r requirements-design.txt
      - name: Check content and diagram pairing
        run: |
          python tools/fieldbook.py check
          python tools/check.py
          python tools/content.py check
      - name: Run offline examples and publication regressions
        run: |
          python -m unittest discover -s tests -v
          node --test examples/health-worker/worker.test.mjs
          python examples/job-state/demo.py
      - name: Build reader site
        run: python tools/build_site.py --base-url https://indeliblevivi.github.io/cf-fieldbook/
      - name: Upload static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .build/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: content-and-examples
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reader site
        id: deployment
        uses: actions/deploy-pages@v5.0.1
