<svg xmlns="http://www.w3.org/2000/svg" width="740" height="225" viewBox="0 0 740 225" role="img" aria-labelledby="title desc"><title id="title">接收、执行与完成是不同阶段</title><desc id="desc">任务由已接收到执行中，再到结果已确认。如果执行的外部结果未知，先进入核对，而不是盲目再做。这里只画主要关系，不是完整状态机。</desc><style>text{font-family:Inter,'Noto Sans CJK SC',sans-serif;fill:#183B46;font-size:20px}.small{font-size:16px;fill:#58717A}.num{font-family:Inter,sans-serif}</style><rect x="0" y="20" width="190" height="64" rx="2" fill="white" stroke="#10B3CA" stroke-width="2"/><text x="95" y="59" text-anchor="middle" font-weight="600">已接收</text><rect x="266" y="20" width="190" height="64" rx="2" fill="white" stroke="#10B3CA" stroke-width="2"/><text x="361" y="59" text-anchor="middle" font-weight="600">执行中</text><rect x="536" y="20" width="190" height="64" rx="2" fill="#ECF9FB" stroke="#10B3CA" stroke-width="2"/><text x="631" y="59" text-anchor="middle" font-weight="600">结果已确认</text><line x1="190" y1="52" x2="266" y2="52" stroke="#10B3CA" stroke-width="3" /><line x1="456" y1="52" x2="536" y2="52" stroke="#10B3CA" stroke-width="3" /><path d="M361 84 V144 H455" fill="none" stroke="#FF7A2A" stroke-width="3"/><rect x="455" y="113" width="271" height="64" rx="2" fill="white" stroke="#FF7A2A" stroke-width="2"/><text x="590" y="152" text-anchor="middle">结果未知 → 先核对</text><text x="0" y="142" class="small">不要把“已接收”当作“已完成”。</text><text x="0" y="205" class="small">只画主要关系；重试、取消与重复投递见状态表。</text></svg>