<svg xmlns="http://www.w3.org/2000/svg" width="740" height="255" viewBox="0 0 740 255" role="img" aria-labelledby="title desc"><title id="title">同一个基线，两份文件环境</title><desc id="desc">准备好的文件和依赖基线分别恢复为环境 A 与 B。两边独立修改和检查，不表示进程恢复或结果自动合并。</desc><style>text{font-family:Inter,'Noto Sans CJK SC',sans-serif;fill:#183B46;font-size:20px}.small{font-size:16px;fill:#58717A}.num{font-family:Inter,sans-serif}</style><rect x="12" y="89" width="192" height="70" rx="2" fill="white" stroke="#10B3CA" stroke-width="2"/><text x="108" y="119" text-anchor="middle">准备好的文件</text><text x="108" y="143" text-anchor="middle" class="small">与依赖基线</text><path d="M204 124 H269 V48 H317 M269 124 V204 H317" stroke="#10B3CA" stroke-width="3" fill="none"/><rect x="317" y="16" width="145" height="64" rx="2" fill="white" stroke="#10B3CA" stroke-width="2"/><text x="389" y="56" text-anchor="middle">环境 A</text><rect x="317" y="172" width="145" height="64" rx="2" fill="white" stroke="#10B3CA" stroke-width="2"/><text x="389" y="212" text-anchor="middle">环境 B</text><line x1="462" y1="48" x2="523" y2="48" stroke="#FF7A2A" stroke-width="3" /><line x1="462" y1="204" x2="523" y2="204" stroke="#FF7A2A" stroke-width="3" /><rect x="523" y="16" width="182" height="64" rx="2" fill="white" stroke="#FF7A2A" stroke-width="2"/><text x="614" y="55" text-anchor="middle">修改 · 检查</text><rect x="523" y="172" width="182" height="64" rx="2" fill="white" stroke="#FF7A2A" stroke-width="2"/><text x="614" y="211" text-anchor="middle">修改 · 检查</text><line x1="719" y1="16" x2="719" y2="236" stroke="#C6E4E9" stroke-width="2" /><text x="360" y="125" text-anchor="middle" class="small">同一个起点，独立试验</text></svg>