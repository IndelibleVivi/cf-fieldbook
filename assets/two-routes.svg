<svg xmlns="http://www.w3.org/2000/svg" width="740" height="292" viewBox="0 0 740 292" role="img" aria-labelledby="title desc"><title id="title">两种应用入口</title><desc id="desc">路线A：浏览器到Worker，再到绑定的数据资源。路线B：浏览器经Tunnel到原有应用与数据。私人访问另外安排Access与应用授权。</desc><style>text{font-family:Inter,'Noto Sans CJK SC',sans-serif;fill:#183B46;font-size:20px}.small{font-size:16px;fill:#58717A}.num{font-family:Inter,sans-serif}</style><g id="route-platform"><text x="0" y="23" font-weight="600">A  /  程序运行在平台上</text><rect x="0" y="44" width="145" height="62" rx="2" fill="none" stroke="#10B3CA" stroke-width="2"/><text x="72.5" y="82" text-anchor="middle">浏览器</text><rect x="238" y="44" width="176" height="62" rx="2" fill="none" stroke="#10B3CA" stroke-width="2"/><text x="326.0" y="82" text-anchor="middle">Worker</text><rect x="508" y="44" width="218" height="62" rx="2" fill="none" stroke="#10B3CA" stroke-width="2"/><text x="617.0" y="82" text-anchor="middle">绑定的数据资源</text><line x1="145" y1="75" x2="238" y2="75" stroke="#10B3CA" stroke-width="2" /><line x1="414" y1="75" x2="508" y2="75" stroke="#10B3CA" stroke-width="2" /></g><g id="route-origin"><text x="0" y="151" font-weight="600">B  /  程序留在原设备</text><rect x="0" y="172" width="145" height="62" rx="2" fill="none" stroke="#FF7A2A" stroke-width="2"/><text x="72.5" y="210" text-anchor="middle">浏览器</text><rect x="238" y="172" width="176" height="62" rx="2" fill="none" stroke="#FF7A2A" stroke-width="2"/><text x="326.0" y="210" text-anchor="middle">Tunnel</text><rect x="508" y="172" width="218" height="62" rx="2" fill="none" stroke="#FF7A2A" stroke-width="2"/><text x="617.0" y="210" text-anchor="middle">原有应用与数据</text><line x1="145" y1="203" x2="238" y2="203" stroke="#FF7A2A" stroke-width="2" /><line x1="414" y1="203" x2="508" y2="203" stroke="#FF7A2A" stroke-width="2" /></g><text x="0" y="273" class="small">需要私人访问时，在入口安排 Access 与应用授权。</text></svg>