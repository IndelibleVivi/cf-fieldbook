<svg xmlns="http://www.w3.org/2000/svg" width="740" height="335" viewBox="0 0 740 335" role="img" aria-labelledby="title desc"><title id="title">关闭时间改变内存用量</title><desc id="desc">相同 4 GiB 配置每月执行100次。立即关闭每次2分钟，总内存13.33GiB小时；每次另空闲10分钟，总内存80GiB小时。条长按0至12分钟同一尺度绘制。</desc><style>text{font-family:Inter,'Noto Sans CJK SC',sans-serif;fill:#183B46;font-size:20px}.small{font-size:16px;fill:#58717A}.num{font-family:Inter,sans-serif}</style><text x="0" y="24" font-weight="600">每次 2 分钟的任务</text><text x="738" y="24" text-anchor="end" class="small">同一规格 · 100 次／月</text><text x="0" y="96" >立即关闭</text><text x="0" y="174" >多等十分钟</text><rect x="154" y="65" width="90" height="46" rx="2" fill="#10B3CA" stroke="#10B3CA" stroke-width="0"/><rect x="154" y="143" width="90" height="46" rx="2" fill="#10B3CA" stroke="#10B3CA" stroke-width="0"/><rect x="244" y="143" width="450" height="46" rx="2" fill="#FF7A2A" stroke="#FF7A2A" stroke-width="0"/><text x="199" y="94" text-anchor="middle" font-weight="600">2 min</text><text x="199" y="172" text-anchor="middle" font-weight="600">2 min</text><text x="469" y="172" text-anchor="middle" font-weight="600">空闲 10 min</text><line x1="154" y1="208" x2="154" y2="215" stroke="#C6E4E9" stroke-width="1.5" /><text x="154" y="241" text-anchor="middle" class="small">0</text><line x1="244" y1="208" x2="244" y2="215" stroke="#C6E4E9" stroke-width="1.5" /><text x="244" y="241" text-anchor="middle" class="small">2</text><line x1="334" y1="208" x2="334" y2="215" stroke="#C6E4E9" stroke-width="1.5" /><text x="334" y="241" text-anchor="middle" class="small">4</text><line x1="424" y1="208" x2="424" y2="215" stroke="#C6E4E9" stroke-width="1.5" /><text x="424" y="241" text-anchor="middle" class="small">6</text><line x1="514" y1="208" x2="514" y2="215" stroke="#C6E4E9" stroke-width="1.5" /><text x="514" y="241" text-anchor="middle" class="small">8</text><line x1="604" y1="208" x2="604" y2="215" stroke="#C6E4E9" stroke-width="1.5" /><text x="604" y="241" text-anchor="middle" class="small">10</text><line x1="694" y1="208" x2="694" y2="215" stroke="#C6E4E9" stroke-width="1.5" /><text x="694" y="241" text-anchor="middle" class="small">12</text><line x1="154" y1="208" x2="694" y2="208" stroke="#C6E4E9" stroke-width="1.5" /><text x="739" y="241" text-anchor="end" class="small">分钟</text><text x="0" y="286" font-weight="600">内存用量：13.33 → 80 GiB·小时／月</text><text x="0" y="315" class="small">运行时长变成 6 倍；CPU 不把空闲时间按满载计算。</text></svg>