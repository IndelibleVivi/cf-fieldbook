<svg lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="360" height="462" viewBox="0 0 360 462" role="img" aria-labelledby="title desc"><title id="title">接收、执行与完成 · 手机阅读版</title><desc id="desc">任务由已接收到执行中，再到结果已确认。执行中的外部结果未知时，分支进入先核对；不从已确认状态分支。这里只画主线，不是完整状态机。</desc><style>text{font-family:Inter,'Noto Sans CJK SC',sans-serif;fill:#183B46;font-size:20px}.small{font-size:16px;fill:#58717A}.num{font-family:Inter,sans-serif}</style><rect width="360" height="462" fill="#FFFFFF"/><g id="task-stage-0"><rect x="36" y="12" width="288" height="58" rx="2" fill="white" stroke="#10B3CA" stroke-width="2"/><text x="180" y="48" text-anchor="middle" font-weight="600">已接收</text></g><line x1="180" y1="74" x2="180" y2="99" stroke="#10B3CA" stroke-width="2" /><path d="M176 93 L180 99 L184 93" fill="none" stroke="#10B3CA" stroke-width="2"/><g id="task-stage-1"><rect x="36" y="106" width="288" height="58" rx="2" fill="white" stroke="#10B3CA" stroke-width="2"/><text x="180" y="142" text-anchor="middle" font-weight="600">执行中</text></g><line x1="180" y1="168" x2="180" y2="193" stroke="#10B3CA" stroke-width="2" /><path d="M176 187 L180 193 L184 187" fill="none" stroke="#10B3CA" stroke-width="2"/><g id="task-stage-2"><rect x="36" y="200" width="288" height="58" rx="2" fill="#ECF9FB" stroke="#10B3CA" stroke-width="2"/><text x="180" y="236" text-anchor="middle" font-weight="600">结果已确认</text></g><path d="M36 135 H16 V323 H36" fill="none" stroke="#FF7A2A" stroke-width="2"/><path d="M30 319 L36 323 L30 327" fill="none" stroke="#FF7A2A" stroke-width="2"/><g id="task-unknown"><rect x="36" y="292" width="288" height="62" rx="2" fill="white" stroke="#FF7A2A" stroke-width="2"/><text x="180" y="329" text-anchor="middle" style="font-size:19px">结果未知 → 先核对</text></g><text x="36" y="390" style="font-size:17px">“已接收”不等于“已完成”。</text><text x="36" y="420" style="font-size:16px">仅示意主线；重试、取消与</text><text x="36" y="444" style="font-size:16px">重复投递见邻近状态表。</text></svg>