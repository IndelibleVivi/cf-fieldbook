<svg lang="zh-CN" xmlns="http://www.w3.org/2000/svg" width="360" height="426" viewBox="0 0 360 426" role="img" aria-labelledby="title desc"><title id="title">两种应用入口 · 手机阅读版</title><desc id="desc">左：浏览器到 Worker，再到绑定的数据资源。右：浏览器经 Tunnel 到原有应用与数据。两条路线都要按需要另行安排 Access 与应用授权。箭头表示请求方向。</desc><style>text{font-family:Inter,'Noto Sans CJK SC',sans-serif;fill:#183B46;font-size:20px}.small{font-size:16px;fill:#58717A}.num{font-family:Inter,sans-serif}</style><g id="route-platform"><text x="12" y="24" font-weight="600" style="font-size:20px">A</text><text x="12" y="49" style="font-size:16px">程序运行在平台上</text><rect x="12" y="74" width="144" height="58" rx="2" fill="none" stroke="#10B3CA" stroke-width="2"/><text x="84" y="109" text-anchor="middle" style="font-size:18px">浏览器</text><line x1="84" y1="135" x2="84" y2="161" stroke="#10B3CA" stroke-width="2" /><path d="M80 155 L84 161 L88 155" fill="none" stroke="#10B3CA" stroke-width="2"/><rect x="12" y="168" width="144" height="58" rx="2" fill="none" stroke="#10B3CA" stroke-width="2"/><text x="84" y="203" text-anchor="middle" style="font-size:18px">Worker</text><line x1="84" y1="229" x2="84" y2="255" stroke="#10B3CA" stroke-width="2" /><path d="M80 249 L84 255 L88 249" fill="none" stroke="#10B3CA" stroke-width="2"/><rect x="12" y="262" width="144" height="58" rx="2" fill="none" stroke="#10B3CA" stroke-width="2"/><text x="84" y="297" text-anchor="middle" style="font-size:18px">绑定的数据资源</text></g><g id="route-origin"><text x="192" y="24" font-weight="600" style="font-size:20px">B</text><text x="192" y="49" style="font-size:16px">程序留在原设备</text><rect x="192" y="74" width="144" height="58" rx="2" fill="none" stroke="#FF7A2A" stroke-width="2"/><text x="264" y="109" text-anchor="middle" style="font-size:18px">浏览器</text><line x1="264" y1="135" x2="264" y2="161" stroke="#FF7A2A" stroke-width="2" /><path d="M260 155 L264 161 L268 155" fill="none" stroke="#FF7A2A" stroke-width="2"/><rect x="192" y="168" width="144" height="58" rx="2" fill="none" stroke="#FF7A2A" stroke-width="2"/><text x="264" y="203" text-anchor="middle" style="font-size:18px">Tunnel</text><line x1="264" y1="229" x2="264" y2="255" stroke="#FF7A2A" stroke-width="2" /><path d="M260 249 L264 255 L268 249" fill="none" stroke="#FF7A2A" stroke-width="2"/><rect x="192" y="262" width="144" height="58" rx="2" fill="none" stroke="#FF7A2A" stroke-width="2"/><text x="264" y="297" text-anchor="middle" style="font-size:18px">原有应用与数据</text></g><line x1="12" y1="348" x2="348" y2="348" stroke="#C6E4E9" stroke-width="2" /><text x="12" y="378" style="font-size:17px">需要私人访问时，另行安排</text><text x="12" y="405" style="font-size:17px">Access 与应用授权。</text></svg>